# ==============================================================================
# Blood Donor Network Web Application Configuration
# ==============================================================================

# Application Metadata
spring.application.name=BloodDonorNetwork-Web
server.port=8080

# MySQL Database Connectivity (configured via environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blood_network?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf Template Engine Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Development Tools (Live reload & restart)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
