<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error: Blood Donor Network')}"></head>
<body>

    <!-- Header Navigation -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="auth-wrapper">
        <div class="auth-card" style="text-align: center; max-width: 500px;">
            <div class="auth-icon" style="background: var(--danger-bg); color: var(--danger);">
                <i data-lucide="alert-octagon" style="width: 28px; height: 28px;"></i>
            </div>
            <h1 class="auth-title" style="margin-bottom: 0.5rem;">500: Server Processing Error</h1>
            <p class="auth-subtitle" style="margin-bottom: 1.5rem;">
                An unexpected server condition occurred while processing your clinical request. Sensitive details have been safely logged on the server.
            </p>

            <div style="display: flex; gap: 0.75rem; justify-content: center;">
                <a th:href="@{/}" class="btn btn-primary">
                    <i data-lucide="home" style="width: 16px; height: 16px;"></i>
                    <span>Back to Overview</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
